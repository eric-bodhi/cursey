[package]
name = "cursey"
version = "0.1.0"
edition = "2024"
description = "A small vim-like text editor"

[dependencies]
cursey-core = { path = "core" }
ratatui = "0.30.2"

[workspace]
members = ["core"]
default-members = [".", "core"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
